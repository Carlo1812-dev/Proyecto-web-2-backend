spring.application.name=micacharrito

# Base de datos MySQL local.
# En Render se sobrescriben con las variables de entorno
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/micacharrito?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1023320039

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080

# Origenes permitidos para CORS (separados por coma).
# En produccion se agrega la URL de GitHub Pages.
app.cors.origins=http://localhost:4200
