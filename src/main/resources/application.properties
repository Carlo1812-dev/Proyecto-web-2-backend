spring.application.name=micacharrito

# TAREA 1 - Iniciar el proyecto en Angular y Conectar con la base de datos
#
# Base de datos MySQL local (aqui estan los datos de prueba).
# En Render la conexion se sobrescribe con variables de entorno:
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# La contrasena de la base en la nube NUNCA se escribe en este archivo.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/micacharrito?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1023320039}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${PORT:8081}

# Cada peticion usa una conexion nueva y el servidor nunca deja peticiones
# colgadas por reutilizar un socket viejo (evita el "se queda procesando"
# del frontend en desarrollo).
server.keep-alive=false

# Origenes permitidos para CORS (separados por coma).
# "*" deja entrar a cualquier puerto (4200, GitHub Pages, ...).
app.cors.origins=${APP_CORS_ORIGINS:*}
