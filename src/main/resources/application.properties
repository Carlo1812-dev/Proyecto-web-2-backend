spring.application.name=micacharrito

# Conexión a la base de datos inyectada por variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Mantiene tus datos iniciales y estructura
spring.jpa.hibernate.ddl-auto=update

# El puerto lo asignará Render automáticamente
server.port=${PORT:8080}

# Orígenes CORS dinámicos (clave para tu clase ConfiguracionCors)
app.cors.origins=${CORS_URL:http://localhost:4200}
