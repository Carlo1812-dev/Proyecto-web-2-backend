<div class="contenedor">
  <div class="tarjeta">
    <h2>Iniciar Sesion</h2>
    <p class="text-muted">Ingrese con su numero de identificacion y contrasena</p>

    @if (error) {
      <div class="alert alert-danger">{{ error }}</div>
    }

    <form (submit)="ingresar(); $event.preventDefault()">
      <div class="mb-3">
        <label class="form-label">Numero de Identificacion</label>
        <input type="text" class="form-control" [(ngModel)]="identificacion"
               name="identificacion" autocomplete="username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contrasena</label>
        <input type="password" class="form-control" [(ngModel)]="password"
               name="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="text-center mt-3 mb-0">
      ¿No tiene cuenta? <a routerLink="/registro">Registrese aqui</a>
    </p>

    <hr>
    <p class="ayuda mb-0">
      Usuarios de prueba:<br>
      <strong>Administrador:</strong> ADMIN-001 / admin123<br>
      <strong>Usuario:</strong> 1234567890 / usuario123
    </p>
  </div>
</div>
